[project]
name = "bmw-next-backend"
version = "1.0.0"
description = "Unified BMW NEXT Customer, Market, Competitor, Moderator and Judge backend"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
backend = ["datasets.yaml", "mappings/*.yaml", "evidence/*.json", "evidence/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", ".", "tests"]
asyncio_mode = "auto"
markers = [
  "ollama: calls the live local Ollama model (deselect with -m 'not ollama')",
  "bmwdata: needs the supplied BMW datasets in BMW_DATA_DIR",
]
addopts = "-m 'not ollama'"
