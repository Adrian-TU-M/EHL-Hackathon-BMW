[project]
name = "customer-agent"
version = "0.1.0"
description = "BMW NEXT Customer Agent: customer-evidence analysis with Ollama + Qwen"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["customer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ollama: calls the live local Ollama model (deselect with -m 'not ollama')",
  "bmwdata: needs the supplied BMW datasets in BMW_DATA_DIR",
]
addopts = "-m 'not ollama'"
